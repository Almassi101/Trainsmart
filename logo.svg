<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ============================================================
       logo.svg — TrainSmart logo (nagetekend in vector, SVG)
       TS-monogram met voetbal-bolletje, zoals het gekozen ontwerp.
       Voordelen van SVG: blijft altijd scherp, geen los plaatje nodig.
       ============================================================ -->

  <defs>
    <!-- Het blauwe verloop van de S -->
    <linearGradient id="blauw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b3ff"/>
      <stop offset="1" stop-color="#1f7ae0"/>
    </linearGradient>
    <!-- Het witte verloop van de T -->
    <linearGradient id="wit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6e4"/>
    </linearGradient>
  </defs>

  <!-- Donkere achtergrond -->
  <rect width="512" height="512" rx="96" fill="#0b1622"/>

  <!-- De T (wit, schuin afgesneden) -->
  <path fill="url(#wit)"
    d="M 118 96
       L 356 96
       L 336 156
       L 236 156
       L 176 356
       L 108 356
       L 168 156
       L 98 156
       Z"/>

  <!-- De S (blauw verloop, schuine sneden) -->
  <path fill="url(#blauw)"
    d="M 250 160
       L 420 160
       L 398 218
       L 300 218
       L 292 240
       L 396 240
       L 350 396
       L 168 396
       L 190 338
       L 322 338
       L 330 314
       L 226 314
       Z"/>

  <!-- Voetbal-bolletje op de kruising -->
  <g transform="translate(196,66)">
    <circle r="26" fill="#ffffff"/>
    <path fill="#0b1622"
      d="M0 -13 L12 -4 L8 11 L-8 11 L-12 -4 Z"/>
    <path fill="none" stroke="#0b1622" stroke-width="3"
      d="M0 -13 L0 -26 M12 -4 L24 0 M8 11 L16 22 M-8 11 L-16 22 M-12 -4 L-24 0"/>
  </g>
</svg>
